
name: Bitcoin Order App

on:
  push:
    branches:
      - main
      - githubcicd
  pull_request:
    branches:
      - main
      - githubcicd
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ci:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install Dependencies
        run: npm ci --force

      - name: Build
        run: npm run build --force

      - name: Lint
        run: npm run lint

      # Uncomment when tests are ready
      # - name: Test
      #   run: npm run test -- --watch=false --browsers=ChromeHeadless

      - name: Conventional Changelog Action
        id: changelog
        if: github.event_name != 'pull_request'
        uses: TriPSs/conventional-changelog-action@v5
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-file: "false"

      - name: Create Release
        if: >
          github.event_name != 'pull_request' &&
          steps.changelog.outputs.skipped == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.changelog.outputs.tag }}" \
            --title "${{ steps.changelog.outputs.tag }}" \
            --notes "${{ steps.changelog.outputs.clean_changelog }}"

      - name: Deploy
        if: github.event_name != 'pull_request'
        run: npm run deploy

